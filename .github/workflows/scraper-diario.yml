name: Executar scraper diário

on:
  schedule:
    - cron: '0 11 * * *'  # 11h UTC = 8h no horário de Brasília
  workflow_dispatch:

jobs:
  chamar-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint do scraper
        run: curl -X GET https://concurso-monitor-9pm1.onrender.com/scraper/run