name: Rodar scraper de concursos

on:
  schedule:
    - cron: "10 14 * * *"
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Acordar o serviço (ping simples)
        run: |
          curl --max-time 200 \
               --connect-timeout 30 \
               --retry 0 \
               https://concurso-monitor-9pm1.onrender.com/ || true
        continue-on-error: true

      - name: Chamar endpoint do scraper com timeout e retry
        run: |
          curl --fail \
               --retry 2 \
               --retry-delay 15 \
               --retry-all-errors \
               --max-time 200 \
               --connect-timeout 30 \
               https://concurso-monitor-9pm1.onrender.com/scraper/run